name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev ninja-build xvfb

      - name: Configure
        run: cmake -G Ninja -S GUI/src -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_GUI_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: xvfb-run ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Configure
        shell: msys2 {0}
        run: cmake -G Ninja -S GUI/src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI_TESTS=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Run Tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
