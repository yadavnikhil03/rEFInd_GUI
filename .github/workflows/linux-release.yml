name: Linux Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v3.4.7)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev ninja-build

      - name: Build
        run: |
          cmake -G Ninja -S GUI/src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          TAG=${GITHUB_REF_NAME:-${{ inputs.tag }}}
          mkdir -p dist/rEFInd_GUI_${TAG}_linux-x86_64
          cp build/rEFInd_GUI dist/rEFInd_GUI_${TAG}_linux-x86_64/
          cp build/rEFInd_GUI_helper dist/rEFInd_GUI_${TAG}_linux-x86_64/
          cd dist
          tar -czvf rEFInd_GUI_${TAG}_linux-x86_64.tar.gz rEFInd_GUI_${TAG}_linux-x86_64
          rm -rf rEFInd_GUI_${TAG}_linux-x86_64
          sha256sum *.tar.gz > checksums-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: "rEFInd_GUI ${{ github.ref_name || inputs.tag }}"
          body: |
            ## What's Changed
            - Centralized logging: all Qt messages now written to `<dataDir>/GUI/logs/rEFInd_GUI.log`
            - Startup health check: logs OS, Qt version, app version, and privilege state
            - Structured log format: ISO 8601 timestamps with severity levels
            - Log rotation at 512 KB
          files: |
            release/*
          draft: false
          prerelease: false
